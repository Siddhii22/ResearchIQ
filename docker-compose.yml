services:
  researchiq-api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
  researchiq-ui:
    build: .
    command: ["streamlit", "run", "frontend/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "8501:8501"
    environment:
      RESEARCHIQ_API_URL: http://researchiq-api:8000
    depends_on:
      - researchiq-api